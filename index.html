<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Omni Analytics Demo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 2rem;
    background: #f9f9f9;
  }
  h1 {
    text-align: center;
  }
  .container {
    max-width: 900px;
    margin: auto;
  }
  .section {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  .section h2 {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
    margin: 0 0 0.75rem;
  }
  .row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .row input, .row select {
    flex: 1;
    padding: 0.5rem;
    font-size: 0.95rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .row span {
    color: #999;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  button {
    padding: 0.5rem 1rem;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.95rem;
    white-space: nowrap;
  }
  button:hover {
    background: #1d4ed8;
  }
  .error {
    color: red;
    font-size: 0.85rem;
    margin-top: 0.4rem;
  }
  #frames-container {
    margin-top: 1.25rem;
  }
  .frame-wrapper {
    position: relative;
    margin-bottom: 1.25rem;
  }
  .frame-wrapper iframe {
    width: 100%;
    height: 600px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    display: block;
  }
  .frame-wrapper .remove-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 2px 8px;
    font-size: 0.8rem;
    background: rgba(0,0,0,0.45);
    border-radius: 3px;
    z-index: 10;
  }
  .frame-wrapper .remove-btn:hover {
    background: rgba(0,0,0,0.7);
  }
</style>
</head>

<body>
<div class="container">
  <h1>Omni Analytics Embed Demo</h1>

  <div class="section">
    <h2>Add a Direct Embed</h2>
    <div class="row">
      <input type="text" id="directInput" placeholder='URL or <iframe src="..."> tag' />
      <button id="addDirectBtn">Add Iframe</button>
    </div>
    <div class="error" id="directError"></div>
  </div>

  <div class="section">
    <h2>Add a Session Embed</h2>
    <div class="row">
      <select id="sessionSelect">
        <option value="">-- Select Session --</option>
      </select>
      <span>or</span>
      <input type="url" id="customUrl" placeholder="https://..." />
      <button id="addSessionBtn">Add Session</button>
    </div>
    <div class="error" id="sessionError"></div>
  </div>

  <div id="frames-container"></div>
</div>

<script src="app.js"></script>
</body>
</html>
